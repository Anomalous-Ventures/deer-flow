# ============================================================================
# Skills
# ============================================================================

skills:
  container_path: /mnt/skills

# ============================================================================
# Title Generation
# ============================================================================

title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null

# ============================================================================
# Summarization
# ============================================================================

summarization:
  enabled: true
  model_name: utility-fast
  trigger:
    - type: tokens
      value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# Memory
# ============================================================================

memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000

# ============================================================================
# Agents API
# ============================================================================

agents_api:
  enabled: false

# ============================================================================
# Skill Evolution
# ============================================================================

skill_evolution:
  enabled: false
  moderation_model_name: null

# ============================================================================
# Database
# ============================================================================

database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

# ============================================================================
# Run Events
# ============================================================================

run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true
